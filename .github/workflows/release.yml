name: release

# Manual release flow:
#   1. Trigger via Actions tab -> "Run workflow" -> enter version (e.g. 0.0.1)
#      or via CLI: gh workflow run release.yml -f version=0.0.1
#   2. A pre-flight step validates the version, resolves the previous
#      release tag, and fails fast (before any push/tag/release/dispatch)
#      if src/<TAG> already exists or src/<PREV_TAG> is missing.
#   3. Workflow stamps version into plugin.json (in CI only), pushes an
#      orphan release branch with install-ready files, creates the
#      agent-blender-wrapper--v{version} tag on that commit, and publishes a
#      GitHub Release with the zip attached and release notes scoped to
#      commits since the previous release (see AGENTS.md's Contracts
#      section for why, and for the one-time bootstrap this needs).
#   4. The workflow then notifies agent-marketplace directly via
#      MARKETPLACE_DISPATCH_TOKEN.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (semver, no leading v) e.g. 0.0.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # required: prev-release-tag.sh reads local tags (git tag -l), and
          # the src/<TAG> markers pre-flight checks below need real `main`
          # history to compare against.
          fetch-depth: 0

      - name: Pre-flight (scoped-release-notes checks)
        id: pre
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::release.yml must run from refs/heads/main (got '${{ github.ref }}')."
            exit 1
          fi

          PLUGIN_NAME=$(jq -r '.name' .claude-plugin/plugin.json)
          V="${{ inputs.version }}"
          TAG="${PLUGIN_NAME}--v${V}"

          # prev-release-tag.sh validates $V against the strict SemVer 2.0.0
          # grammar and exits 2 on failure (via `set -e`, that fails this
          # step too) -- this folds in what used to be a separate "Validate
          # version is semver" step.
          PREV_TAG=$(git tag -l | bash .github/scripts/prev-release-tag.sh "$PLUGIN_NAME" "$V")

          # Present/absent for a single, exact tag ref. Unlike the old
          # git/refs/tags/<TAG> lookup this replaces (which prefix-matches,
          # so it could not tell "TAG" apart from "TAG-something-else"),
          # git/ref/tags/<TAG> (singular "ref") is an exact match. Anything
          # other than a clean 200 or a 404 is treated as a hard error, not
          # "absent" -- an ambiguous rate-limit/5xx response must never be
          # allowed to look like a free tag.
          ref_state() {
            local ref="$1" err
            err=$(mktemp)
            if gh api "repos/${{ github.repository }}/git/ref/tags/${ref}" --silent 2>"$err"; then
              rm -f "$err"
              echo present
              return 0
            fi
            if grep -q '(HTTP 404)' "$err"; then
              rm -f "$err"
              echo absent
              return 0
            fi
            echo "::error::could not determine whether ref 'tags/${ref}' exists:" >&2
            cat "$err" >&2
            rm -f "$err"
            return 1
          }

          for ref in "$TAG" "src/$TAG"; do
            state=$(ref_state "$ref")
            if [ "$state" = "present" ]; then
              echo "::error::ref 'tags/${ref}' already exists. Delete it first or pick a new version."
              exit 1
            fi
          done

          if [ -n "$PREV_TAG" ]; then
            state=$(ref_state "src/$PREV_TAG")
            if [ "$state" != "present" ]; then
              echo "::error::src/${PREV_TAG} is missing on GitHub, so scoped notes have nothing to diff against. Bootstrap it once with:"
              echo "::error::  git tag src/${PREV_TAG} <head_sha of the release run that published ${PREV_TAG}>"
              echo "::error::  git push origin src/${PREV_TAG}"
              echo "::error::See AGENTS.md's Contracts section for where to find <head_sha>."
              exit 1
            fi
          fi

          # The orphan checkout's `git clean -fdx` (below) deletes
          # .github/, so later steps that still need these scripts read
          # them from a copy outside the worktree.
          SCRIPTS="$RUNNER_TEMP/release-scripts"
          rm -rf "$SCRIPTS"
          mkdir -p "$SCRIPTS"
          cp -a .github/scripts/. "$SCRIPTS/"

          MAIN_SHA=$(git rev-parse HEAD)

          echo "tag=${TAG}"           >> "$GITHUB_OUTPUT"
          echo "prev_tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"
          echo "main_sha=${MAIN_SHA}" >> "$GITHUB_OUTPUT"
          echo "scripts=${SCRIPTS}"   >> "$GITHUB_OUTPUT"

      - name: Stamp version into plugin manifests (in CI only)
        shell: bash
        run: |
          V="${{ inputs.version }}"
          # Both plugin manifests (Claude + Codex) get the same version.
          for manifest in .claude-plugin/plugin.json .codex-plugin/plugin.json; do
            tmp=$(mktemp)
            jq --arg v "$V" '.version = $v' "$manifest" > "$tmp"
            mv "$tmp" "$manifest"
          done
          echo "Stamped version $V"

      - name: Stage install tree and build release zip
        id: stage
        shell: bash
        run: |
          STAGE="build/stage/agent-blender-wrapper"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/.claude-plugin" "$STAGE/.codex-plugin" "$STAGE/skills"
          cp .claude-plugin/plugin.json "$STAGE/.claude-plugin/"
          cp .codex-plugin/plugin.json  "$STAGE/.codex-plugin/"
          cp -a skills/. "$STAGE/skills/"
          cp README.md "$STAGE/"
          cp LICENSE "$STAGE/" 2>/dev/null || true
          # assets/ goes onto the orphan release branch so the dispatch
          # payload's icon URL (raw.githubusercontent.com/${repo}/${TAG}/
          # assets/icon.png) resolves.
          [ -d assets ] && cp -a assets "$STAGE/" || true
          # description.md ships onto the orphan release branch so the dispatch
          # payload's description_url resolves at the tagged commit.
          [ -f description.md ] && cp -a description.md "$STAGE/" || true

          mkdir -p dist
          ZIPNAME="agent-blender-wrapper-${{ inputs.version }}.zip"
          (cd "$STAGE" && zip -r "$GITHUB_WORKSPACE/dist/$ZIPNAME" .)

          echo "stage=$STAGE"      >> "$GITHUB_OUTPUT"
          echo "zip=dist/$ZIPNAME" >> "$GITHUB_OUTPUT"

      - name: Push src/<TAG> marker to main
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.pre.outputs.tag }}"
          MAIN_SHA="${{ steps.pre.outputs.main_sha }}"
          # Unconditional, no skip-if-exists guard: pre-flight checks 3-4
          # already proved src/$TAG is absent, so there is nothing to skip.
          # This marker is the only ref on either side of the release that
          # carries real `main` history -- the orphan release commit
          # created below has no merge-base with anything, which is exactly
          # what left --generate-notes (and --notes-start-tag) with nothing
          # to summarize.
          git push origin "${MAIN_SHA}:refs/tags/src/${TAG}"

      - name: Push orphan release branch and capture commit
        id: rel
        shell: bash
        run: |
          STAGE="${{ steps.stage.outputs.stage }}"
          ZIP="${{ steps.stage.outputs.zip }}"
          if [ ! -d "$STAGE" ]; then
            echo "::error::staging dir $STAGE not produced"; exit 1
          fi
          if [ ! -f "$ZIP" ]; then
            echo "::error::release zip $ZIP not produced"
            ls -la dist/ || true
            exit 1
          fi

          # Stash staging tree AND the release zip outside the worktree, since
          # "git checkout --orphan" + clean will wipe dist/ before we attach
          # the zip to the GitHub Release.
          TMP=$(mktemp -d)
                    # .gitattributes MUST ship on the orphan release branch: Claude Code clones it,
          # and on a Windows machine with core.autocrlf=true (Git-for-Windows default)
          # a checkout without `* text=auto eol=lf` writes CRLF into the plugin cache —
          # and Claude Code silently ignores CRLF skills/agents. (Rebuild incident 2026-08-23.)
          for ga in .gitattributes stamped/.gitattributes; do
            if [ -f "$ga" ]; then cp -a "$ga" "$STAGE/"; break; fi
          done
          cp -a "$STAGE"/. "$TMP/"
          ASSET_DIR=$(mktemp -d)
          cp "$ZIP" "$ASSET_DIR/"
          echo "asset=$ASSET_DIR/$(basename "$ZIP")" >> "$GITHUB_OUTPUT"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout --orphan release
          git rm -rf . > /dev/null 2>&1 || true
          git clean -fdx > /dev/null 2>&1 || true

          leftover=$(find . -mindepth 1 -maxdepth 1 -not -name '.git' || true)
          if [ -n "$leftover" ]; then
            echo "::error::working tree not empty after clean:"; echo "$leftover"; exit 1
          fi

          cp -a "$TMP"/. .

          echo "=== release branch contents ==="
          find . -mindepth 1 -not -path './.git*' | sort

          git add -A
          git commit -m "release: v${{ inputs.version }}"
          git push origin release --force

          SHA=$(git rev-parse HEAD)
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Build scoped release notes and create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.pre.outputs.tag }}"
          PREV_TAG="${{ steps.pre.outputs.prev_tag }}"
          MAIN_SHA="${{ steps.pre.outputs.main_sha }}"

          # Neither --generate-notes nor -f previous_tag_name=... against
          # the orphan tag itself ($TAG, created below on a `release: vX.Y.Z`
          # commit with no parent) can produce real notes: an orphan commit
          # has no merge-base with anything, so GitHub finds no merged-PR
          # history to summarize either way and falls back to a bare
          # "Full Changelog" commits-compare link. --notes-start-tag is the
          # fix that DOES work for a normal, non-orphan library repo -- and
          # is therefore the more likely "simplification" someone reaches
          # for here -- but it hits the exact same no-merge-base wall on
          # this repo's orphan `release` branch, so it is not a fix either.
          # The actual fix is to ask GitHub for notes on the src/<TAG>
          # markers instead: those sit on `main`, where a real previous tag
          # and real merged-PR history exist.
          args=(-f "tag_name=src/${TAG}" -f "target_commitish=${MAIN_SHA}")
          if [ -n "$PREV_TAG" ]; then
            args+=(-f "previous_tag_name=src/${PREV_TAG}")
          fi
          gh api "repos/${{ github.repository }}/releases/generate-notes" "${args[@]}" --jq .body \
            > "$RUNNER_TEMP/notes.md"

          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --target "${{ steps.rel.outputs.sha }}" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            ${{ contains(inputs.version, '-') && '--prerelease' || '' }} \
            "${{ steps.rel.outputs.asset }}"

      # Tags created via GITHUB_TOKEN don't fire downstream push:tags workflows
      # (Actions blocks this to prevent recursive loops). Call the marketplace
      # directly with a separate PAT.
      - name: Dispatch to agent-marketplace
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT:   ${{ secrets.MARKETPLACE_DISPATCH_TOKEN }}
          VERSION:  ${{ inputs.version }}
        run: |
          set -euo pipefail
          TAG="${{ steps.pre.outputs.tag }}"
          SCRIPTS="${{ steps.pre.outputs.scripts }}"

          DESC=$(jq -r '.description' .claude-plugin/plugin.json)
          NAME=$(jq -r '.name'        .claude-plugin/plugin.json)

          # gh release view --json body --jq .body prints nothing at all
          # (not even a blank line) for an empty release body, same as it
          # would for a command that produced no output; the "&& printf x"
          # sentinel plus stripping that trailing "x" below is what tells
          # the two apart.
          CHANGELOG=$(gh release view "$TAG" --repo "${{ github.repository }}" --json body --jq .body && printf x)
          CHANGELOG="${CHANGELOG%x}"
          CHANGELOG="${CHANGELOG%$'\n'}"

          PAYLOAD=$(NAME="$NAME" DESC="$DESC" REPO="${{ github.repository }}" VERSION="$VERSION" TAG="$TAG" CHANGELOG="$CHANGELOG" \
            bash "$SCRIPTS/marketplace-payload.sh")

          # Staging first (lands straight to main, no review), then the
          # curated marketplace (opens a review PR) -- same payload, two
          # independent dispatches.
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/seretos-agents/modular-software-factory-staging/dispatches \
            -d "$PAYLOAD"

          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/seretos-agents/modular-software-factory/dispatches \
            -d "$PAYLOAD"
