name: lint

# Runs on every pull request only -- not on push. A push-triggered run on
# the same branch as an open PR would duplicate the PR run (both fire for
# the same commit), so PRs are the sole trigger.
on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate plugin.json is valid JSON
        run: jq empty .claude-plugin/plugin.json

      - name: Validate codex plugin.json is valid JSON
        run: jq empty .codex-plugin/plugin.json

      # The wrapped MCP is pinned to an exact version in BOTH manifests so uvx
      # reuses one cached environment. A drift between them would silently give
      # Claude and Codex different servers.
      - name: Validate the blender-mcp pin matches across manifests
        run: |
          CLAUDE_PIN=$(jq -r '.mcpServers.blender.args | index("--from") as $i | .[$i + 1]' .claude-plugin/plugin.json)
          CODEX_PIN=$(jq -r '.mcpServers.blender.args | index("--from") as $i | .[$i + 1]' .codex-plugin/plugin.json)
          echo "claude: $CLAUDE_PIN / codex: $CODEX_PIN"
          if [ -z "$CLAUDE_PIN" ] || [ "$CLAUDE_PIN" = "null" ]; then
            echo "::error::No --from pin found in .claude-plugin/plugin.json"; exit 1
          fi
          case "$CLAUDE_PIN" in
            blender-mcp==*) ;;
            *) echo "::error::Pin '$CLAUDE_PIN' must be an exact blender-mcp==X.Y.Z pin"; exit 1 ;;
          esac
          if [ "$CLAUDE_PIN" != "$CODEX_PIN" ]; then
            echo "::error::Manifest pins differ: '$CLAUDE_PIN' vs '$CODEX_PIN'"; exit 1
          fi
          echo "Pin check: OK"

      - name: Validate telemetry stays disabled in both manifests
        run: |
          for manifest in .claude-plugin/plugin.json .codex-plugin/plugin.json; do
            VAL=$(jq -r '.mcpServers.blender.env.BLENDER_MCP_DISABLE_TELEMETRY' "$manifest")
            if [ "$VAL" != "true" ]; then
              echo "::error::$manifest must set BLENDER_MCP_DISABLE_TELEMETRY=true (got '$VAL'). See AGENTS.md."
              exit 1
            fi
          done
          echo "Telemetry check: OK"

      # Validates every skills/*/SKILL.md (frontmatter, name == directory
      # name, fenced python blocks compile, per-skill content markers). See
      # scripts/check_skills.py for the full contract.
      - name: Validate skills/*/SKILL.md
        run: python3 scripts/check_skills.py

      - name: Compile-check all Python shipped under skills/
        run: python3 -m compileall -q skills

  # release.yml's pre-flight step runs .github/scripts/prev-release-tag.sh
  # on ubuntu-latest, but a release published from a Windows machine's
  # local checkout, or an agent working in a Windows worktree, must get the
  # same behaviour -- so this job (unlike `validate` above) runs the
  # scripts' own test suite on both OSes.
  release-scripts:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: jq is available
        run: jq --version

      - name: Run release-scripts tests
        run: python -m unittest discover -s tests -v
